<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOME CONTROL CENTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0017C1; --bg:#F8F8FB; --surface:#FFFFFF; --control:#F1F1F4;
  --text:#000000; --label:#626264; --success:#197A4B; --success-bg:#E6F5EC;
  --error:#CE0000; --warning:#A58000; --warning-bg:#FFF6DD; --border:#E3E3E6;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B0B0E; --surface:#161619; --control:#1F1F23; --text:#F2F2F4;
    --label:#9A9A9E; --success:#3FD68A; --success-bg:#0F2A1D; --error:#FF6B6B;
    --warning:#E0B84A; --warning-bg:#2A2410; --border:#2A2A2E; --primary:#5B72FF;
  }
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:"Noto Sans JP",sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
html,body{height:100%; overflow:hidden;}
.mono{font-family:"Roboto Mono",monospace;}
#app{max-width:960px; margin:0 auto; height:100%; display:flex; flex-direction:column;}
header{display:flex; align-items:center; justify-content:space-between; padding:14px 24px 4px; flex-shrink:0;}
.sysname{font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--label);}
.clock{font-size:24px; font-weight:700;}
.backbtn{
  border:none; background:var(--control); color:var(--text); width:36px; height:36px;
  border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.backbtn:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
main{flex:1; min-height:0; overflow-y:auto; padding:8px 24px 20px;}
.screen-narrow{max-width:440px; margin:0 auto;}
.home-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr));
  grid-auto-rows:min-content; gap:12px; align-content:start;
}
@media (orientation: portrait){
  #app{max-width:520px;}
  .home-grid{grid-template-columns:1fr;}
  html,body{overflow-y:auto;}
  main{overflow-y:visible;}
}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:6px 16px; margin-bottom:14px; overflow:hidden;
}
.cardtitle{font-size:12px; font-weight:700; color:var(--label); padding:12px 4px 4px; letter-spacing:.04em;}
.row{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 4px; border-top:1px solid var(--border);
}
.row:first-of-type{border-top:none;}
.row.clickable{cursor:pointer; background:none; border:none; width:100%; text-align:left; border-top:1px solid var(--border); color:var(--text);}
.row.clickable:first-of-type{border-top:none;}
.rowleft{display:flex; align-items:center; gap:12px;}
.rowlabel{font-size:15px; font-weight:500;}
.rowsub{font-size:12px; color:var(--label); margin-top:2px;}
.pill{
  font-family:"Roboto Mono",monospace; font-size:12px; font-weight:700; letter-spacing:.03em;
  padding:5px 10px; border-radius:20px; background:var(--control); color:var(--label);
}
.pill.on{background:var(--success-bg); color:var(--success);}
.pill.warn{background:var(--warning-bg); color:var(--warning);}
.statusbar{
  display:flex; align-items:center; gap:8px; background:var(--success-bg); color:var(--success);
  padding:10px 14px; border-radius:12px; font-size:13px; font-weight:700; margin:10px 0 18px;
}
.dot{width:8px; height:8px; border-radius:50%; background:var(--success);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:4px;}
.navbtn{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:16px; display:flex; flex-direction:column; align-items:flex-start; gap:10px;
  cursor:pointer; color:var(--text); font-family:inherit;
}
.navbtn:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
.navbtn span{font-size:13px; font-weight:700;}
.icon{width:22px; height:22px; stroke:var(--primary); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.icon.small{width:18px; height:18px;}
.icon.muted{stroke:var(--label);}
button.toggle{
  border:none; background:var(--control); color:var(--label); font-family:"Roboto Mono",monospace;
  font-weight:700; font-size:12px; padding:8px 14px; border-radius:20px; cursor:pointer;
}
button.toggle.on{background:var(--success-bg); color:var(--success);}
button.toggle:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
.bignum{font-size:44px; font-weight:700; font-family:"Roboto Mono",monospace; text-align:center; margin:18px 0 4px;}
.biglabel{text-align:center; color:var(--label); font-size:13px; font-weight:700; letter-spacing:.04em; margin-bottom:18px;}
.slider{
  -webkit-appearance:none; width:100%; height:6px; border-radius:4px; background:var(--control); outline:none;
}
.slider::-webkit-slider-thumb{-webkit-appearance:none; width:24px; height:24px; border-radius:50%; background:var(--primary); cursor:pointer;}
.modebar{display:flex; gap:8px; overflow-x:auto; padding:4px 0 18px;}
.modechip{
  border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:13px; font-weight:500;
  padding:9px 16px; border-radius:20px; white-space:nowrap; cursor:pointer;
}
.modechip.active{background:var(--primary); color:#fff; border-color:var(--primary);}
.lockbtn{
  width:100%; padding:20px; border-radius:14px; border:none; font-size:16px; font-weight:700;
  font-family:"Roboto Mono",monospace; display:flex; align-items:center; justify-content:center; gap:10px;
  background:var(--success-bg); color:var(--success); cursor:pointer;
}
.lockbtn.locked-state{background:var(--control); color:var(--text);}
.confirmwrap{
  position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center;
  padding:24px; z-index:20;
}
.confirmbox{
  background:var(--surface); border-radius:16px; padding:24px; width:100%; max-width:360px; text-align:center;
}
.confirmbox h3{font-size:16px; margin-bottom:6px;}
.confirmbox p{font-size:13px; color:var(--label); margin-bottom:18px;}
.holdbtn{
  width:100%; padding:18px; border-radius:12px; border:none; background:var(--error); color:#fff;
  font-weight:700; font-family:"Roboto Mono",monospace; position:relative; overflow:hidden; cursor:pointer;
}
.holdbtn .fill{position:absolute; left:0; top:0; bottom:0; width:0%; background:rgba(255,255,255,.35);}
.canceltxt{margin-top:12px; background:none; border:none; color:var(--label); font-size:13px; cursor:pointer; padding:10px;}
.player{padding:8px 4px;}
.art{
  width:100%; aspect-ratio:1/1; max-width:150px; margin:0 auto 12px; border-radius:12px;
  background:linear-gradient(135deg,var(--primary),var(--control)); display:flex; align-items:center; justify-content:center;
}
@media (orientation: portrait){
  .player{padding:18px 4px;}
  .art{max-width:220px; margin-bottom:16px;}
}
.trackname{text-align:center; font-size:16px; font-weight:700;}
.trackartist{text-align:center; font-size:13px; color:var(--label); margin-top:2px;}
.progress{display:flex; align-items:center; gap:8px; margin:16px 0; font-size:11px; color:var(--label); font-family:"Roboto Mono",monospace;}
.progressbar{flex:1; height:4px; background:var(--control); border-radius:2px; position:relative;}
.progressbar i{position:absolute; left:0; top:0; bottom:0; width:38%; background:var(--primary); border-radius:2px;}
.controls{display:flex; align-items:center; justify-content:center; gap:24px; margin-bottom:14px;}
.controls button{background:none; border:none; cursor:pointer; padding:8px;}
.controls .play{background:var(--primary); border-radius:50%; padding:14px;}
.controls .play .icon{stroke:#fff;}
.subcontrols{display:flex; justify-content:center; gap:32px;}
.subcontrols button{background:none; border:none; cursor:pointer; padding:6px;}
.subcontrols button.active .icon{stroke:var(--primary);}
.scenecard{
  background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:14px;
}
.scenehead{display:flex; align-items:center; justify-content:between; gap:10px; margin-bottom:10px;}
.scenehead h4{font-size:15px; font-weight:700; flex:1;}
.runbtn{
  border:none; background:var(--primary); color:#fff; font-size:12px; font-weight:700; padding:8px 14px;
  border-radius:20px; cursor:pointer; font-family:"Roboto Mono",monospace;
}
.scenelist{font-size:13px; color:var(--label); line-height:1.9;}
.check{color:var(--success); font-weight:700;}
.hidden{display:none !important;}
#loginScreen{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:var(--bg); z-index:50; padding:24px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.loginbox{width:100%; max-width:320px; text-align:center;}
.logininput{
  width:100%; padding:16px; border-radius:12px; border:1px solid var(--border); background:var(--surface);
  color:var(--text); font-size:20px; text-align:center; letter-spacing:.3em; font-family:"Roboto Mono",monospace;
}
.logininput:focus{outline:2px solid var(--primary); outline-offset:2px;}

/* ---- MUSIC: 左ジャケット / 右歌詞 (1:1) ---- */
.music-layout{display:grid; grid-template-columns:1fr 1fr; gap:20px; height:calc(100dvh - 96px); min-height:240px;}
.music-left{display:flex; flex-direction:column; min-width:0; min-height:0;}
.art-wrap{flex:1 1 0; min-height:0; display:flex; align-items:center; justify-content:center;}
.music-left .art{height:100%; width:auto; aspect-ratio:1/1; max-width:100%; margin:0; border-radius:12px; overflow:hidden;}
.music-left .art img{width:100%; height:100%; object-fit:cover; display:block;}
.trackmeta{text-align:center; padding-top:8px; min-width:0;}
.trackmeta .trackname,.trackmeta .trackartist{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.trackmeta .trackname{font-size:14px;}
.music-left .progress{margin:6px 0 2px;}
.music-left .controls{gap:10px; margin:0;}
.music-left .controls button{padding:4px;}
.music-left .controls .play{padding:10px;}
.controls button.active .icon{stroke:var(--primary);}
.lyrics{
  position:relative; overflow:hidden; min-width:0;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16%,#000 84%,transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 16%,#000 84%,transparent 100%);
}
.lyrics .lyr-line{font-size:clamp(22px,3.4vw,34px); line-height:1.35; padding:8px 4px; color:var(--label); opacity:.5; transition:opacity .25s, color .25s;}
.lyrics .lyr-line.active{color:var(--text); opacity:1; font-weight:700;}
.lyrics .lyr-pad{height:45%;}
.lyrics .lyr-msg{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--label); font-size:14px; text-align:center; padding:0 12px;}
@media (orientation: portrait){
  .music-layout{grid-template-columns:1fr; height:auto;}
  .art-wrap{flex:none; height:200px;}
  .lyrics{height:280px;}
}
/* ---- 検索 / プレイリスト ---- */
.hdrright{display:flex; align-items:center; gap:8px;}
.hdrextra{display:flex; gap:6px;}
.hdrbtn{border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:12px; font-weight:500; padding:7px 12px; border-radius:18px; cursor:pointer; font-family:inherit;}
.hdrbtn.active{background:var(--primary); color:#fff; border-color:var(--primary);}
.hdrbtn:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
.browse{display:flex; flex-direction:column; height:calc(100dvh - 96px); min-height:240px;}
.srch{display:flex; gap:8px; margin-bottom:10px;}
.srch input{flex:1; min-width:0; padding:10px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:15px; font-family:inherit;}
.srch input:focus{outline:2px solid var(--primary); outline-offset:1px;}
.browse-list{flex:1; min-height:0; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:8px; align-content:start;}
.browse-msg{color:var(--label); font-size:13px; text-align:center; padding:24px 12px;}
.trk{display:flex; align-items:center; gap:12px; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:8px; color:var(--text); font-family:inherit; cursor:pointer; min-width:0;}
.trk:active{background:var(--control);}
.trk.on{border-color:var(--success); background:var(--success-bg);}
.trk:disabled{opacity:.5;}
.trk:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
.trk img,.trk .ph{width:44px; height:44px; border-radius:8px; object-fit:cover; flex-shrink:0; background:var(--control);}
.trk .tx{min-width:0;}
.trk .t{font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.trk .s{font-size:12px; color:var(--label); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
#toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:20px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:60; max-width:90vw; text-align:center;}
#toast.show{opacity:1;}
</style>
</head>
<body>
<div id="loginScreen" class="hidden">
  <div class="loginbox">
    <div class="sysname" style="margin-bottom:6px;">HOME CONTROL CENTER</div>
    <h2 style="font-size:18px; margin-bottom:18px;">PINを入力してください</h2>
    <form id="loginForm">
      <input type="password" inputmode="numeric" id="loginPasscode" class="logininput" placeholder="PIN" autocomplete="off" required>
      <p id="loginError" class="rowsub" style="color:var(--error); min-height:16px; margin:8px 0;"></p>
      <button type="submit" class="navbtn" style="width:100%; align-items:center;"><span>ログイン</span></button>
    </form>
  </div>
</div>
<div id="app" class="hidden">
  <header>
    <div id="hdrLeft">
      <div class="sysname">HOME CONTROL CENTER</div>
      <div class="clock mono" id="clock">--:--</div>
    </div>
    <div class="hdrright"><div id="hdrExtra" class="hdrextra"></div>
    <button class="backbtn hidden" id="backBtn" aria-label="戻る">
      <svg class="icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button></div>
  </header>
  <main id="main"></main>
</div>

<script>
/* ---------- SwitchBotプロキシ設定 ----------
   DEPLOY.md の手順でWorkerを立てたあと、下記2つを書き換えてください。
   API_BASEを空のままにすると、このページはこれまで通りモックで動作します
   （APIキーはここには一切書きません。プロキシ側のSecretにのみ保存されます）。
*/
const CONFIG = {
  API_BASE: "https://home-control-center-proxy.a1t0-control.workers.dev",
  DEVICES: {
    lockUpper: "C72C145BC7A8", // 上の鍵
    lockLower: "EB37BA2AE02A", // 下の鍵
    ceiling: "D58EE9D6EF2E",   // シーリングライト (Ceiling Light Pro)
    tape: "02-202601111924-32816822",  // テープライト (赤外線)
    tv: "02-202511131659-91870292",    // テレビ (赤外線)
    ac: "02-202606061248-16501106",    // エアコン (赤外線)
  }
};
const LIVE = !!CONFIG.API_BASE;

/* ---------- アプリログイン(PIN)セッション管理 ----------
   PIN自体はここには書かず、Workerに送って検証してもらう。
   成功時にWorkerが発行する署名付きトークンだけをlocalStorageに保存する。
*/
const Session = {
  get token(){ return localStorage.getItem('hc_session_token'); },
  get expiresAt(){ return +(localStorage.getItem('hc_session_exp') || 0); },
  save(token, expiresInMs){
    localStorage.setItem('hc_session_token', token);
    localStorage.setItem('hc_session_exp', String(Date.now() + expiresInMs));
  },
  clear(){
    localStorage.removeItem('hc_session_token');
    localStorage.removeItem('hc_session_exp');
  },
  get valid(){ return !!this.token && Date.now() < this.expiresAt; },
};
function authHeaders(){
  return Session.token ? {"Authorization": `Bearer ${Session.token}`} : {};
}

async function attemptLogin(passcode){
  try{
    const res = await fetch(`${CONFIG.API_BASE}/api/login`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({passcode}),
    });
    if(res.status === 401) return {ok:false, reason:"pin"};
    if(res.status === 404) return {ok:false, reason:"old_worker"};
    if(!res.ok) return {ok:false, reason:"server", status:res.status};
    const json = await res.json();
    Session.save(json.token, json.expiresInMs);
    return {ok:true};
  }catch(e){
    return {ok:false, reason:"network"};
  }
}

function showLogin(){
  const overlay = document.getElementById('loginScreen');
  overlay.classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  const input = document.getElementById('loginPasscode');
  const err = document.getElementById('loginError');
  err.textContent = '';
  input.value = '';
  setTimeout(()=> input.focus(), 50);
}
function hideLogin(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
}
function setupLoginForm(){
  const form = document.getElementById('loginForm');
  const err = document.getElementById('loginError');
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const btn = form.querySelector('button');
    btn.disabled = true;
    const passcode = document.getElementById('loginPasscode').value;
    const r = await attemptLogin(passcode);
    btn.disabled = false;
    if(r.ok){
      hideLogin();
      init();
    } else {
      const msgs = {
        pin: 'PINが違います。もう一度お試しください。',
        old_worker: 'Workerが古い版のままです（/api/loginが存在しません）。最新のworker.jsをデプロイしてください。',
        network: 'Workerに接続できません。ネットワークとWorkerのURLを確認してください。',
        server: 'Workerでエラーが発生しました（' + r.status + '）。APP_PASSCODE/SESSION_SECRETが未設定の可能性があります。'
      };
      err.textContent = msgs[r.reason] || 'ログインに失敗しました。';
      document.getElementById('loginPasscode').value = '';
    }
  });
}

/* ---------- Spotify (PKCE, クライアントシークレット不要) ---------- */
const SPOTIFY = {
  clientId: "e7c9f19cf1304d51839a2a3a2f099354", // Spotify Developer DashboardのClient ID
  redirectUri: window.location.origin + window.location.pathname,
  scopes: "user-read-currently-playing user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative",
};
const SPOTIFY_LIVE = !!SPOTIFY.clientId;

const SpotifyAuth = {
  get accessToken(){ return localStorage.getItem('sp_access_token'); },
  get refreshToken(){ return localStorage.getItem('sp_refresh_token'); },
  get expiresAt(){ return +(localStorage.getItem('sp_expires_at') || 0); },
  save(tok){
    localStorage.setItem('sp_access_token', tok.access_token);
    if(tok.refresh_token) localStorage.setItem('sp_refresh_token', tok.refresh_token);
    localStorage.setItem('sp_expires_at', String(Date.now() + (tok.expires_in*1000) - 30000));
    if(tok.scope) localStorage.setItem('sp_scope', tok.scope);
  },
  clear(){
    localStorage.removeItem('sp_access_token');
    localStorage.removeItem('sp_refresh_token');
    localStorage.removeItem('sp_expires_at');
    localStorage.removeItem('sp_scope');
    localStorage.removeItem('sp_code_verifier');
  },
  get loggedIn(){ return !!this.refreshToken; },
};

function base64url(bytes){
  let s = btoa(String.fromCharCode(...new Uint8Array(bytes)));
  return s.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function sha256(text){
  const data = new TextEncoder().encode(text);
  return await crypto.subtle.digest('SHA-256', data);
}
function randomString(len){
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return base64url(arr).slice(0, len);
}

async function spotifyLogin(){
  const verifier = randomString(64);
  localStorage.setItem('sp_code_verifier', verifier);
  const challenge = base64url(await sha256(verifier));
  const params = new URLSearchParams({
    client_id: SPOTIFY.clientId,
    response_type: "code",
    redirect_uri: SPOTIFY.redirectUri,
    code_challenge_method: "S256",
    code_challenge: challenge,
    scope: SPOTIFY.scopes,
  });
  window.location.href = "https://accounts.spotify.com/authorize?" + params.toString();
}

async function spotifyHandleRedirect(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if(!code) return;
  const verifier = localStorage.getItem('sp_code_verifier');
  const body = new URLSearchParams({
    client_id: SPOTIFY.clientId,
    grant_type: "authorization_code",
    code,
    redirect_uri: SPOTIFY.redirectUri,
    code_verifier: verifier,
  });
  const res = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: {"Content-Type":"application/x-www-form-urlencoded"},
    body,
  });
  if(res.ok){ SpotifyAuth.save(await res.json()); }
  // URLからcode/stateを消して見た目をきれいにする
  window.history.replaceState({}, "", window.location.pathname);
}

async function spotifyRefresh(){
  const res = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: {"Content-Type":"application/x-www-form-urlencoded"},
    body: new URLSearchParams({
      client_id: SPOTIFY.clientId,
      grant_type: "refresh_token",
      refresh_token: SpotifyAuth.refreshToken,
    }),
  });
  if(res.ok){ SpotifyAuth.save(await res.json()); return true; }
  if(res.status === 400){ SpotifyAuth.clear(); }
  return false;
}

async function spotifyFetch(path, options = {}){
  if(!SPOTIFY_LIVE || !SpotifyAuth.loggedIn) return null;
  if(Date.now() >= SpotifyAuth.expiresAt){
    const ok = await spotifyRefresh();
    if(!ok) return null;
  }
  const res = await fetch(`https://api.spotify.com/v1${path}`, {
    ...options,
    headers: {
      "Authorization": `Bearer ${SpotifyAuth.accessToken}`,
      ...(options.headers || {}),
    },
  });
  if(res.status === 204) return {};
  if(res.status === 401){ await spotifyRefresh(); return null; }
  try{ return await res.json(); }catch{ return {}; }
}

async function spotifySync(){
  if(!SPOTIFY_LIVE || !SpotifyAuth.loggedIn) return false;
  const data = await spotifyFetch("/me/player/currently-playing");
  const before = JSON.stringify(state.music);
  if(!data || !data.item){
    state.music.active = false;
  } else {
    state.music.active = true;
    state.music.id = data.item.id || "";
    state.music.syncAt = performance.now();
    state.music.track = data.item.name;
    state.music.artist = (data.item.artists||[]).map(a=>a.name).join(", ");
    state.music.art = (data.item.album?.images?.[0]?.url) || "";
    state.music.playing = data.is_playing;
    state.music.progressMs = data.progress_ms || 0;
    state.music.durationMs = data.item.duration_ms || 0;
    state.music.shuffle = !!data.shuffle_state;
    state.music.repeat = data.repeat_state && data.repeat_state !== "off";
    if(state.music.id) ensureLyrics(state.music.id);
  }
  return JSON.stringify(state.music) !== before;
}

/* ---------- 歌詞 (Worker経由で非公式の歌詞APIから取得) ---------- */
const lyricsCache = {}; // trackId -> {status:'loading'|'ok'|'none'|'unconfigured'|'error', type, lines}
async function ensureLyrics(id){
  if(!LIVE || !id || lyricsCache[id]) return;
  lyricsCache[id] = {status:'loading'};
  try{
    const res = await fetch(`${CONFIG.API_BASE}/api/lyrics?trackid=${encodeURIComponent(id)}`, {headers: authHeaders()});
    if(res.status === 401){ delete lyricsCache[id]; Session.clear(); showLogin(); return; }
    if(res.status === 501){ lyricsCache[id] = {status:'unconfigured'}; }
    else if(res.status === 404){ lyricsCache[id] = {status:'none'}; }
    else if(!res.ok){ lyricsCache[id] = {status:'error'}; setTimeout(()=>{ if(lyricsCache[id]?.status==='error') delete lyricsCache[id]; }, 30000); }
    else{
      const j = await res.json();
      const lines = (j.lines||[]).map(l=>({t:+l.startTimeMs||0, w:String(l.words||"")})).filter(l=>l.w.trim()!=="" );
      lyricsCache[id] = (j.error || !lines.length) ? {status:'none'} : {status:'ok', type:j.syncType, lines};
    }
  }catch(e){
    lyricsCache[id] = {status:'error'};
    setTimeout(()=>{ if(lyricsCache[id]?.status==='error') delete lyricsCache[id]; }, 30000);
  }
  if(currentScreen()==='music' && state.music.id===id){ buildLyricsView(); updateMusicLive(); }
}

function musicPosMs(){
  const m = state.music;
  const p = m.progressMs + (m.playing ? performance.now() - m.syncAt : 0);
  return Math.max(0, m.durationMs ? Math.min(p, m.durationMs) : p);
}

let lyricsBuiltFor = null, lyricsActiveIdx = -1;
function buildLyricsView(){
  const box = document.getElementById('lyrics');
  if(!box) return;
  const id = state.music.id;
  const c = lyricsCache[id] || {status:'loading'};
  box.textContent = "";
  lyricsActiveIdx = -1; lyricsBuiltFor = id + ':' + c.status;
  if(c.status !== 'ok'){
    const msg = document.createElement('div');
    msg.className = 'lyr-msg';
    msg.textContent = ({loading:'歌詞を取得中…', none:'この曲の歌詞は見つかりませんでした', unconfigured:'歌詞APIが未設定です（LYRICS_API_BASE）', error:'歌詞の取得に失敗しました'})[c.status] || '';
    box.appendChild(msg);
    return;
  }
  const pad1 = document.createElement('div'); pad1.className = 'lyr-pad'; box.appendChild(pad1);
  c.lines.forEach((l,i)=>{
    const d = document.createElement('div');
    d.className = 'lyr-line'; d.dataset.i = i;
    d.textContent = l.w; // textContentで挿入(外部データなのでHTMLとして解釈しない)
    box.appendChild(d);
  });
  const pad2 = document.createElement('div'); pad2.className = 'lyr-pad'; box.appendChild(pad2);
}

function updateMusicLive(){
  if(currentScreen() !== 'music' || !state.music.active) return;
  const pos = musicPosMs();
  const bar = document.getElementById('mProgBar'), cur = document.getElementById('mProgCur');
  if(bar) bar.style.width = (state.music.durationMs ? pos/state.music.durationMs*100 : 0) + '%';
  if(cur) cur.textContent = fmtMs(pos);
  const box = document.getElementById('lyrics');
  if(!box) return;
  const id = state.music.id, c = lyricsCache[id];
  if(lyricsBuiltFor !== id + ':' + (c ? c.status : 'loading')) buildLyricsView();
  if(!c || c.status !== 'ok') return;
  let idx = -1;
  for(let i=0;i<c.lines.length;i++){ if(c.lines[i].t <= pos + 250) idx = i; else break; }
  if(c.type === 'UNSYNCED') return; // タイムタグ無しの歌詞は流さず静的表示
  if(idx === lyricsActiveIdx) return;
  const old = box.querySelector('.lyr-line.active'); if(old) old.classList.remove('active');
  lyricsActiveIdx = idx;
  if(idx < 0) return;
  const el = box.querySelector(`.lyr-line[data-i="${idx}"]`);
  if(!el) return;
  el.classList.add('active');
  box.scrollTo({top: el.offsetTop - box.clientHeight/2 + el.clientHeight/2, behavior:'smooth'});
}
setInterval(updateMusicLive, 300);

function toast(text){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = text; t.classList.add('show');

function hasPlaylistScope(){ return (localStorage.getItem('sp_scope') || '').includes('playlist-read-private'); }

async function spotifyPlay(body){
  const send = deviceId => spotifyFetch(`/me/player/play${deviceId ? '?device_id='+encodeURIComponent(deviceId) : ''}`, {
    method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body),
  });
  let r = await send();
  if(r === null){ toast('Spotifyの認証が切れました。再ログインしてください'); return false; }
  if(r.error){
    const reason = r.error.reason || '';
    if(reason === 'PREMIUM_REQUIRED'){ toast('再生操作にはSpotify Premiumが必要です'); return false; }
    if(r.error.status === 404 || reason === 'NO_ACTIVE_DEVICE'){
      const d = await spotifyFetch('/me/player/devices');
      const list = ((d && d.devices) || []).filter(x=>!x.is_restricted);
      const dev = list.find(x=>x.id === localStorage.getItem('sp_device')) || list[0];
      if(!dev){ toast('再生できるデバイスがありません。Spotifyアプリを開いてください'); return false; }
      r = await send(dev.id);
      if(!r || r.error){ toast('再生に失敗しました'); return false; }
    } else { toast('再生に失敗しました'); return false; }
  }
  return true;
}
async function doSearch(q){

  const r = await spotifyFetch(`/search?q=${encodeURIComponent(q)}&type=track&limit=10&market=JP`);
  musicUI.busy = false;
  if(!r || r.error){ musicUI.results = []; musicUI.msg = '検索に失敗しました'; }
  else musicUI.results = (r.tracks && r.tracks.items) || [];

}
async function loadPlaylists(){

async function loadDevices(){

async function transferTo(id, name){

function browseView(){

    else list = m.playlists.map(p=> item(p.uri,'context',thumb(p.images),p.name,(p.owner && p.owner.display_name) || '')).join('');
  }
  return `<div class="browse">${head}<div class="browse-list">${list}</div></div>`;
}
function bindBrowse(){
  const inp = document.getElementById('srchInput');
  if(inp) inp.value = musicUI.query;
  const f = document.getElementById('srchForm');
  if(f) f.addEventListener('submit', e=>{ e.preventDefault(); const q = inp.value.trim(); if(q) doSearch(q); });
  const re = document.getElementById('spReauth');
  if(re) re.addEventListener('click', spotifyLogin);
  main.querySelectorAll('[data-uri]').forEach(b=> b.addEventListener('click', async ()=>{
    const uri = b.dataset.uri;
    const body = b.dataset.kind === 'track' ? {uris:[uri]} : {context_uri:uri};
    b.disabled = true;
    const ok = await spotifyPlay(body);
    b.disabled = false;
    if(ok){
      musicUI.mode = 'now';
      render('music');
      setTimeout(async ()=>{ await spotifySync(); if(currentScreen()==='music' && musicUI.mode==='now') render('music'); }, 900);
    }
  }));
  main.querySelectorAll('[data-device]').forEach(b=> b.addEventListener('click', async ()=>{
    b.disabled = true;
    await transferTo(b.dataset.device, b.dataset.name);
  }));
  if(musicUI.mode === 'devices' && musicUI.devices === null && !musicUI.busy) loadDevices();
  if(musicUI.mode === 'playlists' && musicUI.playlists === null && hasPlaylistScope() && !musicUI.busy) loadPlaylists();
}

function fmtMs(ms){
  const s = Math.floor(ms/1000);
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

async function apiCommand(deviceId, command, parameter = "default", commandType = "command"){
  if(!LIVE || !deviceId) return {ok:false, mocked:true};
  try{
    const res = await fetch(`${CONFIG.API_BASE}/api/devices/${deviceId}/command`, {
      method: "POST",
      headers: {"Content-Type":"application/json", ...authHeaders()},
      body: JSON.stringify({command, parameter, commandType})
    });
    if(res.status === 401){ Session.clear(); showLogin(); return {ok:false, unauthorized:true}; }
    const json = await res.json();
    return {ok: res.ok && json.statusCode === 100, json};
  }catch(e){
    return {ok:false, error:String(e)};
  }
}

async function apiStatus(deviceId){
  if(!LIVE || !deviceId) return null;
  try{
    const res = await fetch(`${CONFIG.API_BASE}/api/devices/${deviceId}/status`, {
      headers: authHeaders(),
    });
    if(res.status === 401){ Session.clear(); showLogin(); return null; }
    const json = await res.json();
    return json.body || null;
  }catch(e){
    return null;
  }
}

/* ---------- 実機の状態を読み戻して同期 ----------
   HOME LOCKとシーリングライトは実体のあるデバイスなので、
   SwitchBot側に本当の状態を問い合わせて表示を合わせる。
   赤外線機器(TV/テープライト/エアコン)はSwitchBot側にも
   実際の状態という概念がないため対象外。
*/
let lastSyncOk = true;
let lastCommandAt = 0; // 直近でこのアプリからコマンドを送った時刻
const SYNC_COOLDOWN_MS = 8000; // コマンド送信後、この間はクラウド側の反映待ちとして同期をスキップ

function markCommanded(){
  lastCommandAt = Date.now();
}

async function syncRealDevices(){
  if(!LIVE) return false;
  if(Date.now() - lastCommandAt < SYNC_COOLDOWN_MS) return false; // 反映待ち中は自分の表示を信じる
  const [upper, lower, ceil] = await Promise.all([
    apiStatus(CONFIG.DEVICES.lockUpper),
    apiStatus(CONFIG.DEVICES.lockLower),
    apiStatus(CONFIG.DEVICES.ceiling),
  ]);
  let changed = false;
  if(upper && lower){
    // どちらか一方でも解錠なら、全体としては「解錠」扱いにする(安全側)
    const nextLock = (upper.lockState === "locked" && lower.lockState === "locked") ? "LOCKED" : "UNLOCKED";
    if(nextLock !== state.lock){ state.lock = nextLock; changed = true; }
    lastSyncOk = true;
  } else if(upper || lower){
    lastSyncOk = false; // 片方しか取得できなかった=部分的に不明
  } else {
    lastSyncOk = false;
  }
  if(ceil){
    if(typeof ceil.power === "string"){
      const on = ceil.power === "on";
      if(on !== state.ceiling.on){ state.ceiling.on = on; changed = true; }
    }
    if(typeof ceil.brightness === "number" && ceil.brightness !== state.ceiling.brightness){
      state.ceiling.brightness = ceil.brightness; changed = true;
    }
  }
  return changed;
}

function go(screen, push=true){

  backBtn.classList.toggle('hidden', history.length <= 1 && screen === 'home');
  render(screen);
  if(LIVE && (screen === 'security' || screen === 'light')){
    syncRealDevices().then(changed=>{ if(changed && currentScreen()===screen) render(screen); });
  }
  if(SPOTIFY_LIVE && screen === 'music' && SpotifyAuth.loggedIn){
    spotifySync().then(changed=>{ if(changed && currentScreen()===screen) render(screen); });
  }

        <span class="pill ${state.lock==='LOCKED'?'on':'warn'}">${state.lock}</span>
      </div>
    </div>
    <div class="card" style="margin-bottom:0;">
      <div class="cardtitle">LIGHT</div>
      <div class="row clickable" data-nav="light">
        <div class="rowleft">${I.bulb}<div class="rowlabel">CEILING</div></div>
        <span class="pill ${state.ceiling.on?'on':''}">${state.ceiling.on?'ON':'OFF'}</span>
      </div>
      <div class="row clickable" data-nav="light">
        <div class="rowleft">${I.tape}<div class="rowlabel">TAPE</div></div>
        <span class="pill ${state.tape.on?'on':''}">${state.tape.on?'ON':'OFF'}</span>
      </div>
    </div>
    <div class="card" style="margin-bottom:0;">
      <div class="cardtitle">AIR</div>
      <div class="row clickable" data-nav="air">
        <div class="rowleft">${I.ac}<div class="rowlabel">AIR CONDITION</div></div>
        <span class="pill ${state.ac.on?'on':''}">${state.ac.on? state.ac.temp+'°C '+state.ac.mode : 'OFF'}</span>
      </div>
    </div>
    <div class="card" style="margin-bottom:0;">
      <div class="cardtitle">THEATER</div>
      <div class="row clickable" data-nav="theater">
        <div class="rowleft">${I.tv}<div class="rowlabel">TV</div></div>
        <span class="pill ${state.tv.on?'on':''}">${state.tv.on?'ON':'OFF'}</span>
      </div>
    </div>
    <div class="card" style="margin-bottom:0;">
      <div class="cardtitle">MUSIC</div>
      <div class="row clickable" data-nav="music">
        <div class="rowleft">${I.music}<div><div class="rowlabel">${state.music.active ? state.music.track : (SPOTIFY_LIVE ? (SpotifyAuth.loggedIn ? '再生していません' : 'Spotify未ログイン') : 'Spotify未設定')}</div><div class="rowsub">${state.music.active ? state.music.artist : ''}</div></div></div>
        <span class="pill ${state.music.playing?'on':''}">${state.music.active ? (state.music.playing?'PLAYING':'PAUSED') : '-'}</span>
      </div>
    </div>
    <button class="navbtn" data-nav="scenes" style="justify-content:center; flex-direction:row; gap:8px;"><span>SCENES</span>${I.chevron}</button>
    </div>
  `,

  security: ()=>`<div class="screen-narrow">
    <div class="cardtitle">HOME LOCK</div>
    <div class="lockbtn ${state.lock==='LOCKED'?'locked-state':''}" style="margin-top:8px;">
      ${state.lock}
    </div>
    <div style="margin-top:16px;">
      ${state.lock==='LOCKED'
        ? `<button class="navbtn" style="width:100%;" id="unlockBtn"><span>UNLOCK</span></button>`
        : `<button class="navbtn" style="width:100%;" id="lockBtn"><span>LOCK</span></button>`}
    </div>
    <p class="rowsub" style="margin-top:14px;">解錠は長押しで確定します（誤操作防止）。</p>
  </div>`,

  light: ()=>`<div class="screen-narrow">
    <div class="card">
      <div class="cardtitle">CEILING LIGHT</div>
      <div class="row">
        <div class="rowlabel">電源</div>
        <button class="toggle ${state.ceiling.on?'on':''}" id="ceilToggle">${state.ceiling.on?'ON':'OFF'}</button>
      </div>
      <div style="padding:14px 4px;">
        <div class="rowsub" style="margin-bottom:8px;">明るさ ${state.ceiling.brightness}%</div>
        <input type="range" class="slider" id="ceilBright" min="0" max="100" value="${state.ceiling.brightness}">
      </div>
    </div>
    <div class="card">
      <div class="cardtitle">TAPE LIGHT</div>
      <div class="row">
        <div class="rowlabel">電源</div>
        <button class="toggle ${state.tape.on?'on':''}" id="tapeToggle">${state.tape.on?'ON':'OFF'}</button>
      </div>
    </div>
  </div>`,

  air: ()=>`<div class="screen-narrow">
    <div class="bignum">${state.ac.temp}°C</div>
    <div class="biglabel">${state.ac.mode} ・ FAN ${state.ac.fan} ・ ${state.ac.on?'ON':'OFF'}</div>
    <div class="modebar">
      ${["COOL","HEAT","DRY","AUTO"].map(m=>`<button class="modechip ${state.ac.mode===m?'active':''}" data-mode="${m}">${m}</button>`).join('')}
    </div>
    <div class="card">
      <div class="row">
        <div class="rowlabel">電源</div>
        <button class="toggle ${state.ac.on?'on':''}" id="acToggle">${state.ac.on?'ON':'OFF'}</button>
      </div>
      <div style="padding:14px 4px;">
        <div class="rowsub" style="margin-bottom:8px;">温度</div>
        <input type="range" class="slider" id="acTemp" min="18" max="30" value="${state.ac.temp}">
      </div>
    </div>
  </div>`,

  theater: ()=>`<div class="screen-narrow">
    <div class="card">
      <div class="row">
        <div class="rowlabel">電源</div>
        <button class="toggle ${state.tv.on?'on':''}" id="tvToggle">${state.tv.on?'ON':'OFF'}</button>
      </div>
      <div class="row">
        <div class="rowlabel">入力</div>
        <span class="pill">${state.tv.input}</span>
      </div>
      <div style="padding:14px 4px;">
        <div class="rowsub" style="margin-bottom:8px;">音量 ${state.tv.volume}</div>
        <input type="range" class="slider" id="tvVol" min="0" max="50" value="${state.tv.volume}">
      </div>
    </div>
  </div>`,

  music: ()=>{
    if(!SPOTIFY_LIVE){
      return `<div class="screen-narrow"><div class="player"><p class="rowsub" style="text-align:center; padding:24px 0;">Spotify連携が未設定です。<br>Client IDを設定すると使えるようになります。</p></div></div>`;
    }
    if(!SpotifyAuth.loggedIn){
      return `<div class="screen-narrow">
        <div class="player" style="text-align:center; padding:24px 0;">
          ${I.music.replace('width="22" height="22"','width="40" height="40"')}
          <p class="rowsub" style="margin:14px 0 18px;">Spotifyにログインすると<br>再生状況を表示・操作できます</p>
          <button class="navbtn" id="spLoginBtn" style="width:100%; align-items:center;"><span>Spotifyにログイン</span></button>
        </div></div>`;
    }
    if(musicUI.mode !== 'now') return browseView();
    if(!state.music.active){
      return `<div class="screen-narrow">
        <div class="player" style="text-align:center; padding:24px 0;">
          ${I.music.replace('width="22" height="22"','width="40" height="40"')}
          <p class="rowsub" style="margin:14px 0;">現在再生中の項目がありません</p>
        </div></div>`;
    }
    return `<div class="music-layout">
      <div class="music-left">
        <div class="art-wrap"><div class="art">${state.music.art ? `<img src="${esc(state.music.art)}" alt="">` : I.music.replace('width="22" height="22"','width="48" height="48"').replace('stroke="var(--primary)"','stroke="#fff"')}</div></div>
        <div class="trackmeta">
          <div class="trackname">${esc(state.music.track)}</div>
          <div class="trackartist">${esc(state.music.artist)}</div>
        </div>
        <div class="progress mono">
          <span id="mProgCur">${fmtMs(musicPosMs())}</span><div class="progressbar"><i id="mProgBar" style="width:${state.music.durationMs? (musicPosMs()/state.music.durationMs*100):0}%"></i></div><span>${fmtMs(state.music.durationMs)}</span>
        </div>
        <div class="controls">
          <button id="shufBtn" class="${state.music.shuffle?'active':''}">${I.shuffle}</button>
          <button id="prevBtn">${I.prev}</button>
          <button class="play" id="playBtn">${state.music.playing?I.pause:I.play}</button>
          <button id="nextBtn">${I.next}</button>
          <button id="repBtn" class="${state.music.repeat?'active':''}">${I.repeat}</button>
        </div>
      </div>
      <div class="lyrics" id="lyrics"></div>
    </div>`;
  },

  scenes: ()=>{
    const scenes = [
      {id:"movie", name:"MOVIE MODE", items:["TV ON","CEILING 20%","TAPE ON","AIR 26°C COOL"]},
      {id:"music", name:"MUSIC MODE", items:["CEILING MUSIC SETTING","TAPE ON","AIR SETTING","SPOTIFY OPEN"]},
      {id:"night", name:"NIGHT MODE", items:["CEILING OFF","TAPE OFF","TV OFF","AIR SETTING"]},
      {id:"leave", name:"LEAVE HOME", items:["LIGHT OFF","TV OFF","TAPE OFF","AIR OFF","HOME LOCK LOCKED"]},
    ];
    return `<div class="home-grid">` + scenes.map(s=>`
      <div class="scenecard" style="margin-bottom:0;">
        <div class="scenehead">
          <h4>${s.name}</h4>
          <button class="runbtn" data-scene="${s.id}">RUN</button>
        </div>
        <div class="scenelist" id="scene-${s.id}">
          ${s.items.map(i=>`<div>・${i}</div>`).join('')}
        </div>
      </div>
    `).join('') + `</div>`;
  }
};

/* ---------- bindings ---------- */
function bind(screen){
  main.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=> go(el.dataset.nav));
  });

  if(screen === 'security'){
    const unlockBtn = document.getElementById('unlockBtn');
    const lockBtn = document.getElementById('lockBtn');
    if(unlockBtn) unlockBtn.addEventListener('click', ()=> confirmUnlock());
    if(lockBtn) lockBtn.addEventListener('click', async ()=>{
      lockBtn.disabled = true;
      const results = await Promise.all([
        apiCommand(CONFIG.DEVICES.lockUpper, "lock"),
        apiCommand(CONFIG.DEVICES.lockLower, "lock"),
      ]);
      if(LIVE && results.some(r=>!r.ok)){
        alert("施錠に失敗しました。機器の状態を確認してください。");
      } else {
        state.lock="LOCKED";
        markCommanded();
      }
      go('security', false);
    });
  }

  if(screen === 'light'){
    document.getElementById('ceilToggle').addEventListener('click', async ()=>{
      const next = !state.ceiling.on;
      const res = await apiCommand(CONFIG.DEVICES.ceiling, next ? "turnOn" : "turnOff");
      if(LIVE && !res.ok){ alert("照明の操作に失敗しました。"); return go('light', false); }
      state.ceiling.on = next; markCommanded(); go('light', false);
    });
    document.getElementById('tapeToggle').addEventListener('click', async ()=>{
      const next = !state.tape.on;
      const res = await apiCommand(CONFIG.DEVICES.tape, next ? "turnOn" : "turnOff");
      if(LIVE && !res.ok){ alert("テープライトの操作に失敗しました。"); return go('light', false); }
      state.tape.on = next; go('light', false);
    });
    document.getElementById('ceilBright').addEventListener('change', async e=>{
      const v = +e.target.value;
      const res = await apiCommand(CONFIG.DEVICES.ceiling, "setBrightness", String(v));
      if(LIVE && !res.ok){ alert("明るさの変更に失敗しました。"); return; }
      state.ceiling.brightness = v; markCommanded();
    });
  }

  if(screen === 'air'){
    document.getElementById('acToggle').addEventListener('click', async ()=>{
      const next = !state.ac.on;
      const res = await sendACAll({...state.ac, on:next});
      if(LIVE && !res.ok){ alert("エアコンの操作に失敗しました。"); return go('air', false); }
      state.ac.on = next; go('air', false);
    });
    document.getElementById('acTemp').addEventListener('change', async e=>{
      const v = +e.target.value;
      const res = await sendACAll({...state.ac, temp:v});
      if(LIVE && !res.ok){ alert("温度の変更に失敗しました。"); return go('air', false); }
      state.ac.temp = v; go('air', false);
    });
    main.querySelectorAll('[data-mode]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const res = await sendACAll({...state.ac, mode:b.dataset.mode});
        if(LIVE && !res.ok){ alert("モードの変更に失敗しました。"); return go('air', false); }
        state.ac.mode = b.dataset.mode; go('air', false);
      });
    });
  }

  if(screen === 'theater'){
    document.getElementById('tvToggle').addEventListener('click', async ()=>{
      const next = !state.tv.on;
      const res = await apiCommand(CONFIG.DEVICES.tv, next ? "turnOn" : "turnOff");
      if(LIVE && !res.ok){ alert("テレビの操作に失敗しました。"); return go('theater', false); }
      state.tv.on = next; go('theater', false);
    });
    document.getElementById('tvVol').addEventListener('change', async e=>{
      const v = +e.target.value;
      const delta = v - state.tv.volume;
      state.tv.volume = v; // 赤外線リモコンは相対操作のみのため表示上の値として保持
      const steps = Math.min(Math.abs(delta), 5); // 連打しすぎないよう上限を設ける
      for(let i=0;i<steps;i++){
        await apiCommand(CONFIG.DEVICES.tv, delta > 0 ? "volumeAdd" : "volumeSub");
      }
    });
  }

  if(screen === 'music'){
    if(musicUI.mode !== 'now') bindBrowse();
    else if(state.music.active){ ensureLyrics(state.music.id); buildLyricsView(); updateMusicLive(); }
    const loginBtn = document.getElementById('spLoginBtn');
    if(loginBtn){ loginBtn.addEventListener('click', spotifyLogin); }

    const playBtn = document.getElementById('playBtn');
    if(playBtn) playBtn.addEventListener('click', async ()=>{
      const next = !state.music.playing;
      await spotifyFetch(next ? "/me/player/play" : "/me/player/pause", {method:"PUT"});
      state.music.playing = next; go('music', false);
    });
    const prevBtn = document.getElementById('prevBtn');
    if(prevBtn) prevBtn.addEventListener('click', async ()=>{
      await spotifyFetch("/me/player/previous", {method:"POST"});
      setTimeout(async ()=>{ await spotifySync(); go('music', false); }, 400);
    });
    const nextBtn = document.getElementById('nextBtn');
    if(nextBtn) nextBtn.addEventListener('click', async ()=>{
      await spotifyFetch("/me/player/next", {method:"POST"});
      setTimeout(async ()=>{ await spotifySync(); go('music', false); }, 400);
    });
    const shufBtn = document.getElementById('shufBtn');
    if(shufBtn) shufBtn.addEventListener('click', async ()=>{
      const next = !state.music.shuffle;
      await spotifyFetch(`/me/player/shuffle?state=${next}`, {method:"PUT"});
      state.music.shuffle = next; go('music', false);
    });
    const repBtn = document.getElementById('repBtn');
    if(repBtn) repBtn.addEventListener('click', async ()=>{
      const next = !state.music.repeat;
      await spotifyFetch(`/me/player/repeat?state=${next ? "context" : "off"}`, {method:"PUT"});
      state.music.repeat = next; go('music', false);
    });
  }

  if(screen === 'scenes'){
    main.querySelectorAll('[data-scene]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        b.disabled = true;
        await applyScene(b.dataset.scene);
        b.disabled = false;
        const list = document.getElementById('scene-'+b.dataset.scene);
        list.querySelectorAll('div').forEach((d,i)=>{
          setTimeout(()=>{ d.innerHTML = '<span class="check">✓</span> '+d.textContent.replace('・',''); }, i*150);
        });
      });
    });
  }
}

async function applyScene(id){
  if(id==='movie'){
    state.tv.on=true; state.ceiling.brightness=20; state.tape.on=true;
    state.ac.on=true; state.ac.mode="COOL"; state.ac.temp=26;
    markCommanded();
    await Promise.all([
      apiCommand(CONFIG.DEVICES.tv, "turnOn"),
      apiCommand(CONFIG.DEVICES.ceiling, "setBrightness", "20"),
      apiCommand(CONFIG.DEVICES.tape, "turnOn"),
      sendACAll(state.ac),
    ]);
  }
  if(id==='music'){
    state.tape.on=true; state.music.playing=true;
    await apiCommand(CONFIG.DEVICES.tape, "turnOn");
  }
  if(id==='night'){
    state.ceiling.on=false; state.tape.on=false; state.tv.on=false;
    markCommanded();
    await Promise.all([
      apiCommand(CONFIG.DEVICES.ceiling, "turnOff"),
      apiCommand(CONFIG.DEVICES.tape, "turnOff"),
      apiCommand(CONFIG.DEVICES.tv, "turnOff"),
    ]);
  }
  if(id==='leave'){
    state.ceiling.on=false; state.tape.on=false; state.tv.on=false; state.ac.on=false; state.lock="LOCKED";
    markCommanded();
    await Promise.all([
      apiCommand(CONFIG.DEVICES.ceiling, "turnOff"),
      apiCommand(CONFIG.DEVICES.tape, "turnOff"),
      apiCommand(CONFIG.DEVICES.tv, "turnOff"),
      sendACAll({...state.ac, on:false}),
      apiCommand(CONFIG.DEVICES.lockUpper, "lock"),
      apiCommand(CONFIG.DEVICES.lockLower, "lock"),
    ]);
  }
}

/* ---------- unlock confirmation (long press) ---------- */
function confirmUnlock(){
  const wrap = document.createElement('div');
  wrap.className = 'confirmwrap';
  wrap.innerHTML = `
    <div class="confirmbox">
      <h3>HOME LOCK を解錠しますか？</h3>
      <p>ボタンを長押しして確定してください</p>
      <button class="holdbtn" id="holdBtn"><div class="fill" id="holdFill"></div>UNLOCK</button>
      <button class="canceltxt" id="cancelHold">キャンセル</button>
    </div>`;
  document.body.appendChild(wrap);

  const holdBtn = wrap.querySelector('#holdBtn');
  const fill = wrap.querySelector('#holdFill');
  let timer=null, pct=0;

  function start(){
    pct=0;
    timer = setInterval(()=>{
      pct += 4;
      fill.style.width = pct+'%';
      if(pct>=100){
        clearInterval(timer);
        finishUnlock();
      }
    }, 40);
  }
  async function finishUnlock(){
    holdBtn.disabled = true;
    const results = await Promise.all([
      apiCommand(CONFIG.DEVICES.lockUpper, "unlock"),
      apiCommand(CONFIG.DEVICES.lockLower, "unlock"),
    ]);
    wrap.remove();
    if(LIVE && results.some(r=>!r.ok)){
      alert("解錠に失敗しました。機器の状態を確認してください。");
      go('security', false);
      return;
    }
    state.lock = "UNLOCKED";
    markCommanded();
    go('security', false);
  }
  function stop(){ clearInterval(timer); fill.style.width='0%'; }

  holdBtn.addEventListener('mousedown', start);
  holdBtn.addEventListener('touchstart', start);
  ['mouseup','mouseleave','touchend'].forEach(ev=> holdBtn.addEventListener(ev, stop));
  wrap.querySelector('#cancelHold').addEventListener('click', ()=> wrap.remove());
}

/* ---------- init ---------- */
async function init(){
  if(SPOTIFY_LIVE) await spotifyHandleRedirect(); // ?code= が付いて戻ってきた場合はトークン交換
  history = ['home'];
  render('home');

  if(LIVE){
    syncRealDevices().then(changed=>{ if(changed) render(currentScreen()); });
    setInterval(async ()=>{
      const changed = await syncRealDevices();
      const s = currentScreen();
      if(changed && (s === 'home' || s === 'security' || s === 'light')){
        render(s);
      }
    }, 20000);
  }

  if(SPOTIFY_LIVE && SpotifyAuth.loggedIn){
    spotifySync().then(()=> render(currentScreen()));
    setInterval(async ()=>{
      const sig = m=>[m.active,m.id,m.playing,m.shuffle,m.repeat,m.track].join('|');
      const before = sig(state.music);
      await spotifySync();
      const s = currentScreen();
      if(sig(state.music) !== before){ if(s === 'home' || (s === 'music' && musicUI.mode === 'now')) render(s); }
      else if(s === 'music') updateMusicLive();
    }, 5000);
  }
}
/* ---------- 起動シーケンス: ログイン確認 → アプリ表示 ---------- */
setupLoginForm();
if(LIVE){
  if(Session.valid){
    hideLogin();
    init();
  } else {
    Session.clear();
    showLogin();
  }
} else {
  // Workerが未設定(モック動作)の場合は認証をスキップ
  hideLogin();
  init();
}
</script>
